# TCN Training Configuration

paths:
  feature_root: "data/preprocessed"
  label_root: "data/preprocessed"
  cache_dir: "runs/cache"
  model_export_dir: "runs/models"
  checkpoint_dir: "runs/checkpoints"

data:
  resolutions: ["fast", "mid", "slow"]
  feature_set: "phase8"
  # Maximum files to load (0 = all). Set to specific numbers (e.g., 100) for debugging/testing.
  limit_files: 10
  # Clip standardized features to avoid extreme z-scores that can destabilize training.
  standardize_clip: 10.0
  # Splits
  val_days: 4
  test_days: 3
  
training:
  target: "t40" # Primary target horizon
  primary_only: true # Ignore other targets if true
  sequence_len: 48
  batch_size: 96
  epochs: 20
  learning_rate: 8.0e-5
  min_learning_rate: 5.0e-6
  weight_decay: 1.0e-2
  max_gradient_norm: 1.0
  # Limit how far ahead labels can look when deciding which side (up/down) hits first.
  # 600s horizon on 1s bars ~ 600 lookahead.
  label_lookahead_bars: 600
  patience: 4
  min_delta: 1.0e-3
  baseline_margin: 0.01
  baseline_patience: 3
  min_epochs: 3
  # Debugging: how many validation batches to log per-epoch (0 = disabled)
  log_val_batches: 10
  # Debugging: flag unusually large validation batches
  val_loss_alert_threshold: 10.0
  log_val_outlier_batches: 5
  
  # Loss configuration
  class_weight_power: 0.4
  target_loss_weights: null # List of floats if using multiple targets

chunking:
  enabled: false
  chunk_size_gb: 2.0   # Target RAM budget per chunk
  local_epochs: 3      # How many passes to make over each chunk before discarding
  prefetch_chunks: 2   # Overlap disk I/O with compute
  shuffle_entries: true
  seed: 1337

model:
  hidden_dim: 32
  layers: 2
  stacks: 1
  kernel_size: 5
  dilation_base: 2
  dropout: 0.4

trade_simulation:
  threshold: 0.90
  threshold_sweep: [0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.99]
  min_trades: 1
  target_ticks: 40.0
  stop_ticks: 40.0
  tick_size: 0.25

evaluation:
  enable_logistic_baseline: false
  logistic_max_samples: 200000
  logistic_max_iter: 200
  logistic_C: 1.0
  logistic_solver: "saga"
  logistic_random_state: 1337

system:
  device: "cuda"
  num_workers: 0
  pin_memory: true
