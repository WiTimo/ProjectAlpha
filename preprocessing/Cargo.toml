[package]
name = "preprocessing"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
time = { version = "0.3", features = ["macros", "serde", "parsing"] }
arrow-array = "54.0"
arrow-schema = "54.0"
parquet = { version = "54.0", features = ["arrow"] }
ordered-float = "4.2"

[features]
default = []
realtime = []

[dev-dependencies]
tempfile = "3.10"


[[bin]]
name = "realtime"
path = "src/bin/realtime.rs"